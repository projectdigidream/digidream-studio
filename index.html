<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The same viewport rules as client/index.html, for the same reasons: the
     page reaches under the notch, a double tap is not a zoom, a drag is not a
     scroll. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d12">
<link rel="icon" type="image/png" href="./src/app/icon.png">
<!-- The kit's structure (uikit, vendored); the skin's look goes on top of it (src/skin.js). -->
<link rel="stylesheet" href="./vendor/uikit/kit.css">
<title>Digidream Studio</title>
<style>
  /* Colours come from the skin (src/skin.js); the fallbacks are the first
     paint, before its bundle arrives, and look like the default skin. */
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--dnp-color-bg-app, #0b0d12); color: var(--dnp-color-text-primary, #cfe3ff);
    font-size: 14px; line-height: 1.4; font-family: var(--dnp-font-ui, ui-monospace, SFMono-Regular, Menlo, monospace);
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; }
  /* THE BOOT SCREEN is the kit's ui-boot: these rules are its first paint,
     before the skin arrives. Their look sits under :where(), so the skin's
     boot (any skin) takes over once it is worn; layout keeps the id. */
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; z-index: 200; }
  #boot[hidden] { display: none; }
  :where(#boot) { gap: 10px; background: var(--dnp-color-bg-app, #0b0d12); }
  :where(#boot .bar) { width: min(60vw, 320px); height: 4px; background: var(--dnp-color-bg-raised, #1b2230); border-radius: 2px; }
  #boot .bar { overflow: hidden; max-width: 92vw; }
  #boot .fill { height: 100%; width: 0; transition: width 120ms linear; }
  :where(#boot .fill) { background: var(--dnp-color-accent, #5b8fd6); }
  /* What loading is doing, step by step, and what went wrong: for the person
     looking at it, and for whoever they send it to. */
  #bootlog { margin: 6px 0 0; width: min(92vw, 680px); max-height: 38vh; overflow: auto; white-space: pre-wrap; word-break: break-word; -webkit-user-select: text; user-select: text; text-align: left; height: auto; }
  :where(#bootlog) { font-size: 11px; line-height: 1.45; font-family: var(--dnp-font-mono, ui-monospace, SFMono-Regular, Menlo, monospace); color: var(--dnp-color-text-dim, #6f7e96); }
  #bootlog .bad { color: var(--dnp-color-error, #ff8a8a); }
  #bootlog .slow { color: var(--dnp-color-warn, #ffd27a); }
  #bootactions { display: flex; gap: 8px; }
  #bootactions[hidden] { display: none; }
  :where(#bootactions button) { height: 34px; padding: 0 14px; border-radius: 8px; background: var(--dnp-color-bg-raised, #1b2230); color: var(--dnp-color-text-primary, #cfe3ff); border: 1px solid var(--dnp-color-line-main, #2a3446); font-size: 13px; font-weight: 600; font-family: var(--dnp-font-ui, ui-monospace, Menlo, monospace); }
</style>
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three/three.module.js",
    "three/": "/vendor/three/"
  }
}
</script>
<!-- The native shell's hook, exactly as client/index.html has it: a classic
     script, so `window.dnp` exists before the module below asks for it. -->
<script src="/shell.js"></script>
<script type="module" src="./src/main.js"></script>
</head>
<body>
  <div id="boot" class="ui-boot"><div class="ui-boot__title">Studio</div><div class="bar ui-boot__track"><div class="fill ui-boot__fill" id="bootfill"></div></div><div id="bootmsg" class="ui-boot__status">starting</div>
    <pre id="bootlog" class="ui-boot__log"></pre>
    <div id="bootactions" hidden><button id="bootcopy" class="ui-button">copy this</button><button id="bootreload" class="ui-button">reload</button></div></div>
<script>
// THE LOADING LOG, before any module runs: so a module that fails to load at
// all (a 404, a syntax error, an error thrown at the top of main.js) is said
// here, not left as a stage that never moves. main.js adds its steps through
// window.__bootLog and names the step it is in with window.__bootStage.
(function () {
  var log = document.getElementById('bootlog')
  var actions = document.getElementById('bootactions')
  var boot = document.getElementById('boot')
  var t0 = performance.now()
  var text = []
  var since = function () { return ((performance.now() - t0) / 1000).toFixed(2) + 's' }
  window.__bootLog = function (line, kind) {
    var row = document.createElement('div')
    row.className = 'ui-boot__line' + (kind ? ' ' + kind : '')
    row.textContent = since() + '  ' + line
    log.appendChild(row)
    log.scrollTop = log.scrollHeight
    text.push(row.textContent)
    if (kind === 'bad') actions.hidden = false
  }
  window.__bootText = function () { return text.join('\n') }
  var said = function (e, what) {
    if (boot.hidden) return
    var err = e && (e.error || e.reason) || e
    var msg = (err && err.message) || String(err && err.message === '' ? err : (e && e.message) || err)
    var stack = err && err.stack ? '\n' + String(err.stack).split('\n').slice(0, 6).join('\n') : ''
    var at = e && e.filename ? ' (' + e.filename.replace(location.origin, '') + ':' + e.lineno + ')' : ''
    window.__bootLog(what + ' during "' + (window.__bootStage || 'starting') + '": ' + msg + at + stack, 'bad')
  }
  addEventListener('error', function (e) {
    // A resource that failed (a script, a picture): its element, not an Error.
    if (e.target && e.target !== window && (e.target.src || e.target.href)) { if (!boot.hidden) window.__bootLog('could not load ' + (e.target.src || e.target.href).replace(location.origin, ''), 'bad'); return }
    said(e, 'error')
  }, true)
  addEventListener('unhandledrejection', function (e) { said(e, 'error') })
  // A step that does not end: said once it has taken a while, and again later.
  var last = null, lastAt = 0, warned = 0
  setInterval(function () {
    if (boot.hidden) return
    var st = window.__bootStage || 'starting'
    if (st !== last) { last = st; lastAt = performance.now(); warned = 0; return }
    var s = (performance.now() - lastAt) / 1000
    if ((warned === 0 && s > 10) || (warned === 1 && s > 30)) {
      warned++
      window.__bootLog('still on "' + st + '" after ' + Math.round(s) + 's' + (window.__bootStep ? ' -- last step: ' + window.__bootStep : ''), 'slow')
      actions.hidden = false
    }
  }, 1000)
  document.getElementById('bootcopy').onclick = function () {
    var t = 'Digidream Studio, loading\n' + navigator.userAgent + '\n' + location.href + '\n' + window.__bootText()
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(function () { window.__bootLog('copied') }, function () { window.__bootLog('could not copy: select the text above instead') })
  }
  document.getElementById('bootreload').onclick = function () { location.href = './' }
})()
</script>
</body>
</html>
