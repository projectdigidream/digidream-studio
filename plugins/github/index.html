<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sync</title>
<style>
  :root { color-scheme: dark; --bg: #0b0d12; --panel: #12161e; --raised: #1a2030; --line: #2a3446; --fg: #e8f0ff; --dim: #8796ad;
          --accent: #6ea8ff; --on-accent: #08101e; --ok: #7fd18b; --warn: #ffcf6b; --bad: #ff8a8a; --info: #8fb8ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); }
  body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
  main { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 13px; margin: 0 0 8px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  p { margin: 0; }
  .dim { color: var(--dim); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1 1 auto; min-width: 0; }
  ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--dim); }
  input[type=text], input[type=password] { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-width: 0; width: 100%; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 560px) { .fields { grid-template-columns: 1fr; } }
  button { font: inherit; color: var(--fg); background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
  button.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; }
  button:disabled { opacity: .5; cursor: default; }
  .err { color: var(--bad); }
  .mods { display: flex; flex-direction: column; }
  .mod { display: flex; flex-direction: column; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
  .mod:first-child { border-top: 0; padding-top: 0; }
  .name { font-weight: 600; }
  .id { color: var(--dim); font-size: 12px; }
  .state { font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  .ok .dot { background: var(--ok); } .warn .dot { background: var(--warn); } .error .dot { background: var(--bad); } .info .dot { background: var(--info); }
  .error { color: var(--bad); }
  .conflict { background: var(--bg); border: 1px solid var(--warn); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .file { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .file .what { flex: 1 1 180px; overflow-wrap: anywhere; }
  .file .pick { display: flex; gap: 14px; flex: none; }
  .file label { flex-direction: row; align-items: center; gap: 4px; color: var(--fg); font-size: 13px; }
  .switch { flex-direction: row; align-items: center; gap: 6px; color: var(--fg); font-size: 13px; }
</style>
<main id="app"><p class="dim">Starting…</p></main>
<script type="module" src="./page.js"></script>
